services:
    controller-1:
      image: apache/kafka:4.2.0
      container_name: controller-1
      networks:
        - kafka_default
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: controller
        KAFKA_LISTENERS: CONTROLLER://:9093
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  
    controller-2:
      image: apache/kafka:4.2.0
      container_name: controller-2
      networks:
        - kafka_default
      environment:
        KAFKA_NODE_ID: 2
        KAFKA_PROCESS_ROLES: controller
        KAFKA_LISTENERS: CONTROLLER://:9093
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  
    controller-3:
      image: apache/kafka:4.2.0
      container_name: controller-3
      networks:
        - kafka_default
      environment:
        KAFKA_NODE_ID: 3
        KAFKA_PROCESS_ROLES: controller
        KAFKA_LISTENERS: CONTROLLER://:9093
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  
    broker-1:
      image: apache/kafka:4.2.0
      container_name: broker-1
      networks:
        - kafka_default
      ports:
        - "29092:9092"
      environment:
        KAFKA_NODE_ID: 4
        KAFKA_PROCESS_ROLES: broker
        KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
        KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      depends_on:
        - controller-1
        - controller-2
        - controller-3
  
    broker-2:
      image: apache/kafka:4.2.0
      container_name: broker-2
      networks:
        - kafka_default
      ports:
        - "39092:9092"
      environment:
        KAFKA_NODE_ID: 5
        KAFKA_PROCESS_ROLES: broker
        KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
        KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      depends_on:
        - controller-1
        - controller-2
        - controller-3
  
    broker-3:
      image: apache/kafka:4.2.0
      container_name: broker-3
      networks:
        - kafka_default
      ports:
        - "49092:9092"
      environment:
        KAFKA_NODE_ID: 6
        KAFKA_PROCESS_ROLES: broker
        KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
        KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      depends_on:
        - controller-1
        - controller-2
        - controller-3

    kafka-connect:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: kafka-connect
      networks:
        - kafka_default
      ports:
        - "8083:8083"
      environment:
        BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
        #primarily used for when you have a cluster of kafka connect instances
        #used for storing the config of the connectors
        CONFIG_STORAGE_TOPIC: connect_configs
        #used for storing the offsets of the connectors
        OFFSET_STORAGE_TOPIC: connect_offsets
        # used for storing the status of the connectors
        STATUS_STORAGE_TOPIC: connect_statuses

        CONFIG_STORAGE_REPLICATION_FACTOR: 3
        OFFSET_STORAGE_REPLICATION_FACTOR: 3
        STATUS_STORAGE_REPLICATION_FACTOR: 3

        KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      depends_on:
        - broker-1
        - broker-2
        - broker-3
networks:
  kafka_default:
    name: docker_kafka_default